@if (esPaqueteRA()) {
  <div>
    <label class="text-ra-slate mb-1 block text-sm font-semibold">
      Entrenador RA <span class="text-red-500">*</span>
    </label>
    @if (cargandoSig()) {
      <div class="input-filled bg-gray-100 text-gray-400">Cargando entrenadores...</div>
    } @else {
      <select
        class="input-filled"
        [value]="entrenadorId() ?? ''"
        (change)="onChange($any($event.target).value)"
      >
        <option value="">— Selecciona entrenador RA —</option>
        @for (e of entrenadoresSig(); track e.idEntrenador) {
          <option [value]="e.idEntrenador">{{ e.nombre }} {{ e.apellido }}</option>
        }
      </select>
    }
    @if (!entrenadorId()) {
      <p class="mt-1 text-xs text-red-600">Selecciona un entrenador RA para este paquete.</p>
    }
  </div>
}
