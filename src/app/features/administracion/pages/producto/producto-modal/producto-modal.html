<div class="mx-auto w-full rounded-2xl bg-white shadow-2xl ring-1 ring-black/5">
  <!-- Header -->
  <div class="flex items-start justify-between px-6 pt-5">
    <h2 class="text-ra-slate text-[20px] leading-none font-bold">{{ titulo() }}</h2>
    <button
      type="button"
      class="grid h-8 w-8 place-items-center rounded-full bg-red-600 text-white hover:bg-red-700"
      (click)="cancelar.emit()"
      aria-label="Cerrar"
    >
      ✕
    </button>
  </div>

  <!-- Form -->
  <form class="space-y-4 px-6 pt-4 pb-6" [formGroup]="form" (ngSubmit)="submit()">
    <!-- SOLO ADMIN: Gimnasio -->
    @if (isAdmin) {
      <ra-campo class="block" etiqueta="Gimnasio" [requerido]="true" [error]="errorGimnasio">
        <select class="input-filled" formControlName="gimnasioId">
          <option [ngValue]="null" disabled>Selecciona un gimnasio</option>
          @for (g of gimnasios; track g.idGimnasio) {
            <option [ngValue]="g.idGimnasio">{{ g.nombre }}</option>
          }
        </select>
      </ra-campo>
    }

    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
      <ra-campo class="block" etiqueta="Nombre" [requerido]="true">
        <input formControlName="nombre" class="input-filled" placeholder="Nombre del producto" />
      </ra-campo>

      <ra-campo class="block" etiqueta="Código">
        <input formControlName="codigo" class="input-filled" placeholder="Código interno / SKU" />
      </ra-campo>
    </div>

    <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
      <ra-campo class="block" etiqueta="Precio de compra" [requerido]="true">
        <input
          type="number"
          step="0.01"
          formControlName="precioCompra"
          class="input-filled"
          placeholder="0.00"
        />
      </ra-campo>
      <ra-campo class="block" etiqueta="Precio de venta" [requerido]="true">
        <input
          type="number"
          step="0.01"
          formControlName="precioVenta"
          class="input-filled"
          placeholder="0.00"
        />
      </ra-campo>
      <ra-campo class="block" etiqueta="Cantidad" [requerido]="true">
        <input
          type="number"
          step="1"
          formControlName="cantidad"
          class="input-filled"
          placeholder="0"
        />
      </ra-campo>
    </div>

    <ra-campo class="block">
      <!-- Sin `etiqueta`: el label real se proyecta a mano porque incluye la
           anotación dinámica "(nombre del gimnasio)" que el input de texto
           plano de ra-campo no puede representar. -->
      <label class="text-ra-slate mb-1.5 block text-sm font-semibold">
        Categoría
        <span class="text-red-600">*</span>
        @if (isAdmin && form.controls.gimnasioId.value != null) {
          <span class="ml-1 text-xs text-gray-500"
            >({{ gimNombrePorId(form.controls.gimnasioId.value) }})</span
          >
        }
      </label>

      <select formControlName="idCategoria" class="input-filled">
        <option [ngValue]="null" disabled>Selecciona una categoría</option>
        @for (c of categoriasFiltradas; track c.idCategoria ?? $index) {
          <option [ngValue]="c.idCategoria">{{ catOptionText(c) }}</option>
        }
      </select>

      @if (
        isAdmin &&
        !cargandoCategorias &&
        form.controls.gimnasioId.value != null &&
        !categoriasFiltradas.length
      ) {
        <p class="mt-1 text-sm text-gray-600">No hay categorías en este gimnasio.</p>
      }
    </ra-campo>

    @if (error) {
      <div class="text-sm text-red-600">{{ error }}</div>
    }

    <div class="flex items-center justify-end gap-2 pt-2">
      <ra-boton variante="ghost" (click)="cancelar.emit()">Cancelar</ra-boton>
      <ra-boton variante="info" tipo="submit" [deshabilitado]="guardando">
        {{ guardando ? 'Guardando…' : 'Guardar' }}
      </ra-boton>
    </div>
  </form>
</div>
