<!-- src/app/pages/administracion/reportes/reportes.html -->

<div class="flex w-full justify-center">
  <div class="mt-4 w-full max-w-3xl rounded-xl bg-white p-6 shadow-sm md:mt-8 md:p-8">
    <!-- Título -->
    <div class="mb-6 border-b pb-4">
      <h2 class="text-xl font-semibold text-slate-800 md:text-2xl">Reportes de movimientos</h2>
      <p class="mt-1 text-sm text-slate-500">
        Selecciona el rango de fechas y el gimnasio para descargar el Excel con
        <span class="font-medium">membresías, ventas y asesorías</span>.
      </p>
    </div>

    <!-- Mensaje de error general -->
    <div
      *ngIf="errorMsg"
      class="mb-4 rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
    >
      {{ errorMsg }}
    </div>

    <!-- Formulario -->
    <form [formGroup]="form" (ngSubmit)="descargar()" class="space-y-4">
      <!-- Gimnasio (solo admin) -->
      <div *ngIf="isAdmin">
        <label class="mb-1 block text-sm font-medium text-slate-700"> Gimnasio </label>

        <div class="relative">
          <select
            formControlName="idGimnasio"
            class="block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-800 shadow-sm focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500 focus:outline-none"
          >
            <option [ngValue]="null">Todos los gimnasios</option>
            <option *ngFor="let g of gimnasios" [ngValue]="gymId(g)">
              {{ displayGimnasio(g) }}
            </option>
          </select>

          <div *ngIf="loadingGimnasios" class="absolute top-2.5 right-3 text-xs text-slate-400">
            Cargando...
          </div>
        </div>
      </div>

      <!-- Fechas -->
      <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        <div>
          <label for="desde" class="mb-1 block text-sm font-medium text-slate-700"> Desde </label>
          <input
            id="desde"
            type="date"
            formControlName="desde"
            class="block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-800 shadow-sm focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500 focus:outline-none"
          />
        </div>

        <div>
          <label for="hasta" class="mb-1 block text-sm font-medium text-slate-700"> Hasta </label>
          <input
            id="hasta"
            type="date"
            formControlName="hasta"
            class="block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-800 shadow-sm focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500 focus:outline-none"
          />
        </div>
      </div>

      <!-- Botón -->
      <div class="flex justify-end pt-2">
        <button
          type="submit"
          [disabled]="loadingExcel"
          class="inline-flex items-center rounded-lg bg-emerald-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-emerald-700 focus:ring-2 focus:ring-emerald-500 focus:ring-offset-1 focus:outline-none disabled:cursor-not-allowed disabled:opacity-60"
        >
          <svg *ngIf="loadingExcel" class="mr-2 h-4 w-4 animate-spin" viewBox="0 0 24 24">
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
              fill="currentColor"
            ></path>
          </svg>
          <span>
            {{ loadingExcel ? 'Generando Excel...' : 'Descargar Excel' }}
          </span>
        </button>
      </div>
    </form>
  </div>
</div>
