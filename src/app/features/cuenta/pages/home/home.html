<!-- src/app/pages/home/home.html -->
<div class="flex min-h-full flex-col gap-4 bg-[#f3f3f3] p-3 sm:p-4 md:gap-5 md:p-6">
  <!-- ── Encabezado usuario ────────────────────────────────────────────── -->
  <div
    class="flex flex-col gap-3 px-1 py-1 sm:flex-row sm:items-center sm:justify-between sm:px-2 sm:py-2"
  >
    <div class="flex min-w-0 items-center gap-3 sm:gap-4">
      <div
        class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-red-100 sm:h-14 sm:w-14"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5 text-red-500 sm:h-7 sm:w-7"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
          />
        </svg>
      </div>
      <div class="min-w-0">
        <p class="mb-1.5 text-xs leading-none font-medium tracking-widest text-gray-400 uppercase">
          Bienvenido
        </p>
        <p
          class="text-lg leading-tight font-medium tracking-wide break-words text-gray-800 uppercase sm:text-2xl sm:tracking-widest"
        >
          {{ nombreDisplay }}
        </p>
      </div>
    </div>
    <div class="flex items-center gap-2 self-start sm:gap-3 sm:self-auto">
      <span
        class="rounded-full px-3 py-1.5 text-xs font-semibold sm:px-4 sm:py-2 sm:text-sm"
        [ngClass]="rolBadge"
        >{{ rolLabel }}</span
      >
      <span class="hidden text-sm text-gray-400 md:block">{{ version }}</span>
    </div>
  </div>

  <!-- ── Cuerpo principal ──────────────────────────────────────────────── -->
  <div class="grid grid-cols-1 gap-5 lg:min-h-0 lg:flex-1 lg:grid-cols-3">
    <!-- Columna izquierda: logo + frase -->
    <div
      class="flex flex-col items-center justify-center gap-5 rounded-2xl bg-white p-5 shadow-sm sm:gap-8 sm:p-8 lg:col-span-1"
    >
      <img
        src="imagenes/logo-ra-sin-fondo.png"
        alt="Revolución Atlética"
        class="w-full max-w-[220px] object-contain sm:max-w-[280px]"
      />
      <p class="text-center text-lg leading-snug font-black text-gray-700 italic sm:text-xl">
        "{{ fraseHome }}"
      </p>
    </div>

    <!-- Columna derecha: lista de novedades -->
    <div
      class="rounded-2xl bg-white shadow-sm lg:col-span-2 lg:flex lg:flex-col lg:overflow-hidden"
    >
      <!-- Header lista -->
      <div class="border-b border-gray-100 px-4 py-3 sm:px-6 sm:py-4">
        <p class="text-xs font-semibold tracking-widest text-gray-400 uppercase">
          Novedades · {{ version }}
        </p>
      </div>

      <!-- Scroll de items -->
      <div class="divide-y divide-gray-50 lg:flex-1 lg:overflow-y-auto">
        @for (n of novedadesFiltradas; track n.titulo) {
          <div
            class="flex items-start gap-3 px-4 py-4 transition-colors hover:bg-gray-50 sm:gap-4 sm:px-6 sm:py-5"
          >
            <!-- Thumbnail -->
            <div
              class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl sm:h-14 sm:w-14"
              [ngClass]="iconBg(n.color)"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5 sm:h-7 sm:w-7"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="n.iconPath" />
              </svg>
            </div>

            <!-- Texto -->
            <div class="min-w-0 flex-1 pt-1">
              <p class="mb-1 text-[13px] font-bold text-gray-800 sm:text-sm">{{ n.titulo }}</p>
              <p class="text-xs leading-relaxed text-gray-500">{{ n.descripcion }}</p>
            </div>
          </div>
        }
      </div>

      <!-- Footer -->
      <div class="border-t border-gray-100 bg-gray-50 px-4 py-3 sm:px-6">
        <p class="text-xs text-gray-400">Revolución Atlética · Sistema de gestión</p>
      </div>
    </div>
  </div>
</div>
