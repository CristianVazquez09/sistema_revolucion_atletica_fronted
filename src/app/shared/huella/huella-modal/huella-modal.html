<div class="fixed inset-0 z-[1000] grid place-items-center bg-black/50">
  <div class="w-full max-w-md rounded-2xl bg-white p-5 shadow-xl">
    <div class="mb-1 text-xl font-bold">Capturar huella</div>
    <div class="mb-4 text-sm text-gray-600">
      Coloca el dedo en el lector. Se tomará <b>una</b> muestra.
    </div>

    <div class="space-y-3">
      <div *ngIf="errorMsg()" class="text-sm text-red-600">{{ errorMsg() }}</div>
      <div class="text-sm text-gray-700">
        Calidad: {{ calidad() == null ? '—' : calidad() === 0 ? 'OK' : calidad() }}
      </div>

      <div *ngIf="previews().length" class="flex justify-center">
        <img
          [src]="previews()[0]"
          alt="Huella"
          class="h-40 w-40 rounded-md border object-contain"
        />
      </div>
    </div>

    <div class="mt-5 flex justify-end gap-2">
      <button class="rounded-md bg-gray-200 px-4 py-2 hover:bg-gray-300" (click)="cerrar()">
        Cancelar
      </button>
      <button
        class="rounded-md bg-blue-600 px-4 py-2 text-white hover:bg-blue-700"
        (click)="reintentar()"
      >
        Reintentar
      </button>
    </div>
  </div>
</div>
